name: CI

on:
  push:
    branches: [main]
  pull_request:

# One queue entry per ref (or per PR number, so successive pushes to the same PR don't queue
# behind each other) - mirrors the other studylife-* repos' pipelines.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

# Least-privilege default for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache without paying the cost of a
      # clean cache on every normal run - only retries with a forced clean if the first
      # `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studylife-streamdeck-plugin
          path: com.lukislp.studylife.streamDeckPlugin
          retention-days: 7

  # ---------------------------------------------------------------------
  # Version / release - push to main only (mirrors studylife-vscode's ci.yml pattern).
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      # ref: main (branch tip), not the default github.sha (the push event's SHA) - a "[skip ci]"
      # commit (e.g. a version-bump commit from a previous release, or another push) can land on
      # main between this workflow's trigger and this job actually starting. If this checked out
      # github.sha instead, semantic-release's "local branch is behind the remote" guard would
      # then analyze that now-stale SHA and silently skip the release entirely - no error, just
      # nothing published (seen live in sibling studylife-* repos). ref: main always resolves to
      # whatever main points to right now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # Ruleset bypass for the release commit: main is protected by a ruleset (pull request +
      # green test stage) that the GitHub Actions app cannot be a bypass actor for on a personal
      # repository, so semantic-release pushes over SSH as a write-enabled DEPLOY KEY instead,
      # which can. No-op while the secret is unset - the push then goes through the GITHUB_TOKEN
      # https remote exactly as before. Needed in get-version too: @semantic-release/git's
      # verifyConditions runs `git push --dry-run` even in dry-run mode. Same mechanism as
      # lukislp/studylife's ci-cd.yml.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@045f17628d155f7e56c2f6ebdbd473b31e247112 # v1.6.0
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci || (npm cache clean --force && npm ci)
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@045f17628d155f7e56c2f6ebdbd473b31e247112 # v1.6.0
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure." | tee -a "$GITHUB_STEP_SUMMARY"

  semantic-release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Keyless signing + build provenance for the release asset (see the last steps).
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@045f17628d155f7e56c2f6ebdbd473b31e247112 # v1.6.0
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci || (npm cache clean --force && npm ci)
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@045f17628d155f7e56c2f6ebdbd473b31e247112 # v1.6.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        id: semrel_retry
        uses: lukislp/ci-workflows/.github/actions/semantic-release@045f17628d155f7e56c2f6ebdbd473b31e247112 # v1.6.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the packaged .streamDeckPlugin to the GitHub Release
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        run: |
          TAG="${{ steps.semrel.outputs.new_release_git_tag || steps.semrel_retry.outputs.new_release_git_tag }}"
          npm run build
          npm run package
          gh release upload "$TAG" com.lukislp.studylife.streamDeckPlugin --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed release assets (OpenSSF Scorecard "Signed-Releases"): a keyless Sigstore
      # signature bundle per asset plus one GitHub build-provenance attestation, uploaded next
      # to the assets so a download can be verified offline:
      #   cosign verify-blob --bundle <asset>.sigstore.json \
      #     --certificate-identity-regexp '^https://github.com/lukislp/studylife-streamdeck/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
      - name: Sign the release asset and attach the signature bundle
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag || steps.semrel_retry.outputs.new_release_git_tag }}
        run: |
          for f in com.lukislp.studylife.streamDeckPlugin; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/lukislp/studylife-streamdeck/\.github/workflows/ci\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            gh release upload "$TAG" "$f.sigstore.json" --clobber
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        id: provenance
        with:
          subject-path: |
            com.lukislp.studylife.streamDeckPlugin
      - name: Attach the build provenance to the release
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag || steps.semrel_retry.outputs.new_release_git_tag }}
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber
