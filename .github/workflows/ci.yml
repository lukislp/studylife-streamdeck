name: CI

on:
  push:
    branches: [main]
  pull_request:

# One queue entry per ref (or per PR number, so successive pushes to the same PR don't queue
# behind each other) - mirrors the other studylife-* repos' pipelines.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

# Least-privilege default for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# jobs that need more declare it themselves.
permissions:
  contents: read
  # The reusable release workflow resolves its own commit through the Actions API.
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache without paying the cost of a
      # clean cache on every normal run - only retries with a forced clean if the first
      # `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studylife-streamdeck-plugin
          path: com.lukislp.studylife.streamDeckPlugin
          retention-days: 7

  # ---------------------------------------------------------------------
  # Version / release - push to main only (mirrors studylife-vscode's ci.yml pattern).
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@feeee04720178085ec24ffdf8083fc30aea2bedf # v0.9.0
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@feeee04720178085ec24ffdf8083fc30aea2bedf # v0.9.0
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Builds the packaged plugin at the released version and attaches it, its Sigstore bundle and the
  # build provenance to the GitHub Release the `release` job created. The tag is created by the
  # lktec-bot App through the API (no signature on the tag); these assets are what to verify.
  publish-assets:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Keyless signing + build provenance for the release asset (see the last steps).
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Write the released version into manifest.json and package.json
        run: |
          node scripts/set-manifest-version.mjs "$VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run build
      - run: npm run package
      - name: Upload the packaged .streamDeckPlugin to the GitHub Release
        run: gh release upload "$TAG" com.lukislp.studylife.streamDeckPlugin --clobber
      # Signed release assets (OpenSSF Scorecard "Signed-Releases"): a keyless Sigstore
      # signature bundle per asset plus one GitHub build-provenance attestation, uploaded next
      # to the assets so a download can be verified offline:
      #   cosign verify-blob --bundle <asset>.sigstore.json \
      #     --certificate-identity-regexp '^https://github.com/lukislp/studylife-streamdeck/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the release asset and attach the signature bundle
        run: |
          for f in com.lukislp.studylife.streamDeckPlugin; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/lukislp/studylife-streamdeck/\.github/workflows/ci\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            gh release upload "$TAG" "$f.sigstore.json" --clobber
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            com.lukislp.studylife.streamDeckPlugin
      - name: Attach the build provenance to the release
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber
